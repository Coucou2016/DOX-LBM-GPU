[pytest]
# Avoid broken third-party pytest plugins in base conda (zarr/numcodecs).
addopts = -p no:cacheprovider
# Do NOT blanket-ignore all warnings — keep cardiac_ms solver warnings visible.
filterwarnings =
    ignore::DeprecationWarning:zarr.*
    ignore::DeprecationWarning:numcodecs.*
    ignore::PendingDeprecationWarning:zarr.*
    default::UserWarning:cardiac_ms.*
    default::RuntimeWarning:cardiac_ms.*
